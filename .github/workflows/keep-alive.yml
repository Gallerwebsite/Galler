# Free keep-alive: pings Render every 5 minutes so the API stays warm.
# Works even on Vercel Hobby (Vercel Cron is daily-only on Hobby).
name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health
        run: |
          URL="${{ vars.RENDER_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://galler-c29a.onrender.com/api/health"
          fi
          echo "Pinging $URL"
          curl -fsS --max-time 20 "$URL"
          echo
